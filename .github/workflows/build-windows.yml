name: Build Vanitygen++ Static Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-static:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 安装 MinGW-w64 + 预编译静态库 OpenSSL3 + PCRE + pthread
      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-winpthreads

      - name: Build static linked binaries
        shell: msys2 {0}
        run: |
          # 编译 CPU 版本 vanitygen++ (静态链接)
          gcc -O3 -Wall -static -static-libgcc -static-libstdc++ \
            vanitygen.c oclvanitygen.c oclvanityminer.c \
            -o vanitygen++.exe \
            -lpcre -lcrypto -lpthread

          # 编译 OpenCL GPU 版本 oclvanitygen++
          gcc -O3 -Wall -static -static-libgcc -static-libstdc++ \
            oclvanitygen.c vanitygen.c oclvanityminer.c \
            -o oclvanitygen++.exe \
            -lpcre -lcrypto -lpthread -lOpenCL

          ls -la *.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanitygen-win64-static
          path: |
            vanitygen++.exe
            oclvanitygen++.exe
