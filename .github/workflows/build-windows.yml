name: Build Vanitygen++ Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare dependencies
        run: powershell -ExecutionPolicy Bypass -File .\prepare_deps.ps1

      - name: Patch Makefile.Win32 path
        run: |
          (Get-Content Makefile.Win32) -replace 'OPENSSL_DIR \?=.*','OPENSSL_DIR ?= $(pwd)\deps\openssl-win64' | Set-Content Makefile.Win32
          (Get-Content Makefile.Win32) -replace 'PTHREADS_DIR \?=.*','PTHREADS_DIR ?= $(pwd)\deps\pthreads-win64' | Set-Content Makefile.Win32
          (Get-Content Makefile.Win32) -replace 'PCRE_DIR \?=.*','PCRE_DIR ?= $(pwd)\deps\pcre-win64' | Set-Content Makefile.Win32

      - name: Build all targets
        run: nmake /f Makefile.Win32 all

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: vanitygen-win64-bin
          path: |
            vanitygen++.exe
            oclvanitygen++.exe
            keyconv.exe
