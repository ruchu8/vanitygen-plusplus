name: Build Vanitygen++ Static Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-static:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-winpthreads
            mingw-w64-x86_64-opencl-headers

      - name: Patch winglue.h fix strtok_r conflict
        shell: msys2 {0}
        run: |
          sed -i '46i\#ifndef strtok_r' winglue.h
          sed -i '55a\#endif' winglue.h

      - name: Build CPU vanitygen++ (static, exclude miner)
        shell: msys2 {0}
        run: |
          gcc -O3 -Wall -static -static-libgcc -static-libstdc++ \
            vanitygen.c oclvanitygen.c \
            -o vanitygen++.exe \
            -lpcre -lcrypto -lpthread

          gcc -O3 -Wall -static -static-libgcc -static-libstdc++ \
            oclvanitygen.c vanitygen.c \
            -o oclvanitygen++.exe \
            -lpcre -lcrypto -lpthread -lOpenCL

          ls -la *.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanitygen-win64-static
          path: |
            vanitygen++.exe
            oclvanitygen++.exe
